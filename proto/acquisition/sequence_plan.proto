syntax = "proto3";
package aurora.acquisition;

// Detailed plan for a single chirp within a burst.
message ChirpPlan {
    uint32 chirp_index = 1;
    double chirp_start_s = 2;       // Start time relative to burst start in seconds
    double chirp_duration_s = 3;    // Duration in seconds
    double chirp_start_hz = 4;      // Starting frequency in Hz
    double chirp_bandwidth_hz = 5;  // Frequency sweep bandwidth in Hz

    enum Direction {
        DIRECTION_UNSPECIFIED = 0;
        DIRECTION_UP = 1;
        DIRECTION_DOWN = 2;
    }
    Direction direction = 6;

    repeated double wavelength_m = 7;  // Wavelengths active during this chirp in meters
}

// Complete plan for one acquisition burst: all chirp timing and wavelengths.
// Generated by the SequencePlanner from a SequenceSchedule.
message SequencePlan {
    uint64 plan_id = 1;
    double start_timestamp_s = 2;     // Absolute start time in seconds
    repeated ChirpPlan chirps = 3;
}
